[package]
name = "duckdb-odbc-rust-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
# `bundled` compiles libduckdb from the vendored sources, so no system DuckDB
# install is needed - only a C/C++ toolchain (Xcode CLT / build-essential).
duckdb = { version = "1", features = ["bundled"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
