version: 2

models:
  - name: stg_trips
    description: One row per taxi trip, read straight from Parquet.
    columns:
      - name: pickup_at
        data_tests:
          - not_null
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5, 6]

  - name: payment_summary
    columns:
      - name: payment_type
        data_tests:
          - not_null
          - unique

  - name: trips_by_hour
    columns:
      - name: pickup_hour
        data_tests:
          - not_null
          - unique
